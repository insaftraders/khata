<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
<meta name="robots" content="noindex, nofollow">
<title>My Account</title>
<style>
  :root { --green:#1f6e43; --ink:#15140f; --muted:#6b6457; --line:#efe9db; --red:#b3261e; --bg:#f5f3ee; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink);
         font-size:15px; line-height:1.5; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 14px 40px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px;
          box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .shop { text-align:center; }
  .shop .nm { font-size:22px; font-weight:800; color:var(--green); }
  .shop .ur { font-size:18px; font-weight:700; }
  .shop .tag { color:var(--green); font-weight:600; font-size:13px; margin-top:2px; }
  .shop .meta { color:var(--muted); font-size:12.5px; margin-top:4px; }
  .who { text-align:center; color:var(--muted); font-size:13px; }
  .who b { color:var(--ink); font-size:17px; display:block; margin-top:2px; }
  .bal { text-align:center; padding:22px 14px; }
  .bal .k { text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--muted); }
  .bal .v { font-size:40px; font-weight:800; margin-top:6px; line-height:1.1; }
  .bal .v.owe { color:var(--red); } .bal .v.adv { color:var(--green); } .bal .v.zero { color:var(--ink); }
  .bal .as { color:var(--muted); font-size:12px; margin-top:8px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:4px 4px 8px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  td.n,th.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .deb { color:var(--red); } .cre { color:var(--green); }
  .lbl { font-weight:600; } .dt { color:var(--muted); font-size:11.5px; }
  .foot { text-align:center; color:var(--muted); font-size:11.5px; margin-top:18px; line-height:1.6; }
  .state { text-align:center; padding:60px 20px; color:var(--muted); }
  .state .big { font-size:17px; color:var(--ink); margin-bottom:6px; }
  .bar { height:6px; background:var(--green); border-radius:4px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>
  <div id="app"><div class="state">Loading your account…</div></div>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function rs(p){ var n=(Number(p)||0)/100; var f=Number.isInteger(n)?0:2;
    try { return '₨ '+n.toLocaleString('en-US',{minimumFractionDigits:f,maximumFractionDigits:2}); }
    catch(e){ return '₨ '+n.toFixed(f); } }
  function fdate(iso){ if(!iso) return ''; try { return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); } catch(e){ return iso; } }
  function ftime(ms){ try { return new Date(Number(ms)).toLocaleString(); } catch(e){ return ''; } }
  function state(big, sub){ app.innerHTML = '<div class="state"><div class="big">'+esc(big)+'</div>'+(sub?esc(sub):'')+'</div>'; }

  var token = (location.hash || '').replace(/^#\/?/, '').trim();
  if (!token || !/^[a-zA-Z0-9_-]+$/.test(token)) { state('Invalid link', 'Please scan the QR code on your receipt again.'); return; }

  fetch('c/' + token + '.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(render)
    .catch(function () { state('Account not found', 'This code is not active yet, or the shop has not synced it. Please check with the shop.'); });

  function render(d) {
    var s = d.shop || {}, c = d.customer || {};
    var bal = Number(d.balanceP) || 0;
    var cls = bal > 0 ? 'owe' : bal < 0 ? 'adv' : 'zero';
    var label = bal > 0 ? 'You owe' : bal < 0 ? 'Advance with shop' : 'Account settled';
    var labelUr = bal > 0 ? 'آپ کے ذمے' : bal < 0 ? 'آپ کا جمع' : 'حساب برابر';
    var rows = (d.rows || []).slice().reverse();  // newest first
    var body = rows.map(function (e) {
      var amt = Number(e.deltaP) || 0;
      var amtCls = amt >= 0 ? 'deb' : 'cre';
      var amtTxt = (amt >= 0 ? '+ ' : '− ') + rs(Math.abs(amt));
      return '<tr><td><div class="lbl">' + esc(e.label || '') + '</div><div class="dt">' + esc(fdate(e.date)) + '</div></td>' +
             '<td class="n ' + amtCls + '">' + amtTxt + '</td>' +
             '<td class="n">' + rs(e.balP) + '</td></tr>';
    }).join('');
    if (!body) body = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:24px;">No transactions yet</td></tr>';

    var meta = [s.phone ? 'Tel ' + s.phone : '', s.address || ''].filter(Boolean).map(esc).join(' • ');
    app.innerHTML =
      '<div class="card shop">' +
        '<div class="nm">' + esc(s.name || 'Shop') + (s.nameUrdu ? ' <span class="ur">' + esc(s.nameUrdu) + '</span>' : '') + '</div>' +
        (s.tagline ? '<div class="tag">' + esc(s.tagline) + '</div>' : '') +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
      '</div>' +
      '<div class="card who">Account for<b>' + esc(c.name || '') + '</b></div>' +
      '<div class="card bal"><div class="k">' + esc(label) + ' / ' + esc(labelUr) + '</div>' +
        '<div class="v ' + cls + '">' + rs(Math.abs(bal)) + '</div>' +
        '<div class="as">as of ' + esc(ftime(d.updatedAt)) + '</div></div>' +
      '<div class="card"><h2>Transactions / لین دین</h2>' +
        '<table><thead><tr><th>Detail</th><th class="n">Amount</th><th class="n">Balance</th></tr></thead>' +
        '<tbody>' + body + '</tbody></table></div>' +
      '<div class="foot">This page shows your account as last updated by the shop.<br>' +
        'It refreshes whenever the shop syncs. Updated ' + esc(ftime(d.updatedAt)) + '.</div>';
    document.title = (c.name ? c.name + ' — ' : '') + (s.name || 'My Account');
  }
})();
</script>
</body>
</html>
